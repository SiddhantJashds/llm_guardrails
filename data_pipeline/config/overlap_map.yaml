# HIPAA <-> DPDP identifier overlap (docs/HACKATHON_PLAN.md, Data Scientist Day2 #5).
# `shared` identifiers should use the SAME detector function under both packs
# so they aren't implemented twice; `pack_specific` are unique to one regime.
shared:
  - full_name
  - phone_number # DPDP also adds a bare-10-digit-starting-6-9 rule on top (Indian mobiles)
  - email_address
  - web_url # added 2026-10-09 (docs/adr/0016) -- was HIPAA-only despite being generic, not healthcare-specific
  - ip_address # added 2026-10-09 (docs/adr/0016) -- same reasoning as web_url
  - address # HIPAA's geographic_subdivision <-> DPDP's residential_address (DPDP also adds
            # street/PIN-code regex on top of the shared city/county NER layer)
pack_specific:
  hipaa:
    - ssn_like
    - medical_record_number
    - date_except_year
    - fax_number
  dpdp:
    - aadhaar_like
    - pan_like
    - consent_purpose_flag
