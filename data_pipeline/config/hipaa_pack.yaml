# HIPAA pack v1 -- ~8-10 high-signal identifiers (scoped per non-goals, not
# full Safe Harbor coverage). Loaded into CompliancePackConfig by
# scripts/init_db.py; detectors/hipaa/identifiers.py implements the matching.
pack_id: hipaa
identifiers:
  - name: full_name
    action: redact
  - name: phone_number
    action: redact
  - name: fax_number
    action: redact
  - name: email_address
    action: redact
  - name: geographic_subdivision # smaller than state: street, city, zip
    action: redact
  - name: date_except_year # DOB, admission/discharge dates, etc.
    action: redact
  - name: ssn_like
    action: block
  - name: medical_record_number
    action: hash
